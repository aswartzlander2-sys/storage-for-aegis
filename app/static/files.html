<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robo Storage</title><link rel="stylesheet" href="assets/aegis.css"><link rel="stylesheet" href="assets/style.css"><script defer src="assets/files.js"></script></head><body><main class="file-layout"><div class="file-top"><img src="assets/logo.png" alt="Robo Storage"><div class="grow"><div class="eyebrow">YOUR FILES, YOUR SPACE</div><h1 id="group-name">Robo Storage</h1></div><select id="storage-picker" aria-label="Select storage server"></select></div><div class="notice">Signed in as <strong id="username"></strong>. Your directory and file permissions are enforced on the server.</div><div class="file-tools"><input class="input" id="file-search" placeholder="Search visible files…" aria-label="Search files"><button class="btn" id="refresh-files">↻ Refresh listing</button><span class="grow"></span><button class="btn primary" id="upload-file">＋ Upload file</button><input type="file" id="file-input" hidden></div><div class="panel card"><div id="usage" class="capacity-label"></div><div class="table-wrap"><table><thead><tr><th>FILE PATH</th><th>SIZE</th><th>ACCESS</th><th></th></tr></thead><tbody id="files"></tbody></table></div></div><div id="file-error" class="error" role="alert"></div><p class="form-hint">Uploads in this release are limited to 16 MiB. Close the browser window to clear cached native sign-in credentials.</p></main><dialog id="file-modal"><div class="modal-head"><h2 id="file-modal-title">File operation</h2></div><div class="modal-body" id="file-modal-body"></div><div class="modal-foot"><button class="btn ghost" id="cancel-file">Cancel</button><button class="btn primary" id="confirm-file">Confirm</button></div></dialog></body></html>
